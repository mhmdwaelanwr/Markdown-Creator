name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -d src
          test -f src/services/giphyService.js

      - name: Reject generated or local-only tracked files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(node_modules|dist|build|coverage|\.idea|\.vscode)(/|$)|(^|/)\.env($|\.)|local\.properties$|\.(jks|keystore|p12|pfx|mobileprovision)$'; then
            echo 'Generated, local, or sensitive file is tracked.' >&2
            exit 1
          fi

      - name: Reject archived debug screenshots
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(clip-title|dnd-screenshot(-2)?|headful|page-full|post-fix-render|render-after-(design|fix|pro-features)|render-check|root-only|ui-debug|wait-10s|white-screen-debug)\.png$'; then
            echo 'Local debug screenshot is tracked.' >&2
            exit 1
          fi

      - name: Scan common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z_]{20,}|sk-[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!package-lock.json'; then
            echo 'Possible committed secret detected.' >&2
            exit 1
          fi

      - name: Ensure GIPHY key is not hardcoded
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE "apiKey[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" src/services/giphyService.js src/components/GiphyPickerDialog.js; then
            echo 'Hardcoded GIPHY key detected.' >&2
            exit 1
          fi
